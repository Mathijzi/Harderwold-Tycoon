<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harderwold Tycoon - Projectie</title>
<style>
  :root { --hud: 1; --panel: rgba(18, 30, 28, 0.62); --line: rgba(255,255,255,0.10); }
  html, body { margin: 0; height: 100%; background: #0d1512; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 3840px; height: 2160px; transform-origin: 0 0; }
  #world, #ui { position: absolute; inset: 0; width: 3840px; height: 2160px; image-rendering: auto; }
  #ui { pointer-events: none; }
  #world, #pixi { transform-origin: 0 0; }
  .hud { position: absolute; color: #fff; font-family: Inter, "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; font-feature-settings: "tnum" 1;
         background: var(--panel); backdrop-filter: blur(6px) saturate(1.1); -webkit-backdrop-filter: blur(6px); border-radius: 22px; box-shadow: 0 6px 28px rgba(0,0,0,0.25);
         transform-origin: top left; }
  #lb { left: 26px; top: 26px; width: 500px; padding: 18px 22px 14px; transform: scale(var(--hud)); }
  #lb .hd { display: flex; align-items: center; gap: 14px; font-size: 38px; font-weight: 650; letter-spacing: 0.2px; padding-bottom: 10px; }
  #lb .hd svg { width: 40px; height: 40px; }
  #lb .row { display: flex; align-items: center; height: 54px; border-top: 1px solid var(--line); font-size: 31px; }
  #lb .rk { flex: 0 0 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 25px; margin-right: 18px; }
  #lb .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  #lb .pt { font-weight: 650; min-width: 90px; text-align: right; }
  #st { right: 26px; top: 26px; display: flex; align-items: stretch; padding: 16px 10px; transform: scale(var(--hud)); transform-origin: top right; }
  #st .cell { display: flex; align-items: center; gap: 18px; padding: 4px 30px; border-left: 1px solid var(--line); }
  #st .cell:first-child { border-left: 0; }
  #st svg { width: 58px; height: 58px; flex: none; }
  #st .big { font-size: 38px; font-weight: 650; line-height: 1.08; }
  #st .small { font-size: 25px; opacity: 0.82; line-height: 1.2; }
  #speed { position: absolute; right: 30px; top: 150px; font: 600 24px Inter, system-ui, sans-serif; color: #fff; background: rgba(18,30,28,0.55); padding: 6px 14px; border-radius: 12px; }
  #speed:empty { display: none; }
  #conn { position: absolute; right: 18px; bottom: 16px; width: 14px; height: 14px; border-radius: 50%; background: #999; box-shadow: 0 0 0 3px rgba(0,0,0,0.25); }
  #conn.ok { background: #36d07a; } #conn.bad { background: #e24a4a; }
  /* running crises: status card bottom right, stays until the crisis is fully resolved */
  #crises { position: absolute; right: 26px; bottom: 72px; width: 760px; display: flex; flex-direction: column; gap: 16px; transform: scale(var(--hud)); transform-origin: bottom right; }
  #crises:empty { display: none; }
  #crises .cr { position: relative; color: #fff; font-family: Inter, "Segoe UI", system-ui, sans-serif; background: rgba(70,16,14,0.86); border: 3px solid #d9423a; border-radius: 22px; padding: 18px 24px 20px; box-shadow: 0 6px 28px rgba(0,0,0,0.35); }
  #crises .lbl { font-size: 19px; font-weight: 800; letter-spacing: 1.5px; color: #ffb3ad; display: flex; gap: 12px; align-items: center; }
  #crises .lbl .dot { width: 14px; height: 14px; border-radius: 50%; background: #ff5a4e; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
  #crises .ttl { font-size: 36px; font-weight: 700; margin: 4px 0 2px; }
  #crises .loc { font-size: 24px; opacity: 0.85; }
  #crises .bar { height: 12px; border-radius: 6px; background: rgba(255,255,255,0.18); margin: 14px 0 10px; overflow: hidden; }
  #crises .bar i { display: block; height: 100%; background: linear-gradient(90deg, #ff8a5c, #ffd34d); border-radius: 6px; }
  #crises .row { font-size: 25px; line-height: 1.35; }
  #crises .row b { font-weight: 700; }
  #crises .mut { opacity: 0.75; font-size: 22px; margin-top: 4px; }
  #boot { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font: 600 46px Inter, system-ui, sans-serif; color: #fff; background: rgba(0,0,0,0.5); padding: 24px 40px; border-radius: 18px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="world" width="3840" height="2160"></canvas>
  <canvas id="ui" width="3840" height="2160"></canvas>
  <div id="lb" class="hud">
    <div class="hd"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v4a5 5 0 0 1-10 0V4z"/><path d="M7 6H4.5a2.5 2.5 0 0 0 2.5 4M17 6h2.5A2.5 2.5 0 0 1 17 10"/><path d="M12 13v4M8.5 20h7M10 17h4"/></svg>Spelers</div>
    <div id="lb-rows"></div>
  </div>
  <div id="st" class="hud">
    <div class="cell"><span id="wx" style="display:flex"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4.2" fill="#fff" stroke="none"/><path d="M12 2.5v2.3M12 19.2v2.3M2.5 12h2.3M19.2 12h2.3M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg></span><div><div class="big" id="clock">--</div><div class="small"><span id="date">--</span><span id="temp"></span></div></div></div>
    <div class="cell"><svg viewBox="0 0 24 24" fill="none" stroke="#2bc0c8" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9.2"/><path d="M8.2 14.2c1 1.5 2.3 2.2 3.8 2.2s2.8-.7 3.8-2.2"/><circle cx="9" cy="9.6" r=".9" fill="#2bc0c8"/><circle cx="15" cy="9.6" r=".9" fill="#2bc0c8"/></svg><div><div class="small">Tevredenheid</div><div class="big" id="sat">--</div></div></div>
    <div class="cell"><svg viewBox="0 0 24 24" fill="none" stroke="#5cd08a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/><path d="M6.5 12.5h3l1.5-2.5 2 4.5 1.5-2h3"/></svg><div><div class="small">Parkgezondheid</div><div class="big" id="health">--</div></div></div>
    <div class="cell"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.3 5.3L3.5 17.5l3 3 5.9-5.9a4 4 0 0 0 5.3-5.3l-2.5 2.5-2.6-.4-.4-2.6 2.5-2.5z"/></svg><div><div class="small">Open taken</div><div class="big" id="open">--</div></div></div>
  </div>
  <div id="speed"></div>
  <div id="crises"></div>
  <div id="conn"></div>
  <div id="boot">Laden...</div>
</div>
<script type="module" src="/web/projector.js"></script>
</body>
</html>
