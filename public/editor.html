<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harderwold Kaarteditor</title>
<style>
  :root { --teal: #a85e00; --ink: #1f2a38; --mut: #687880; --bg: #f3f5f4; --card: #fff; --line: #dfe5e4; --map-bg: #eef1ec; --sel: #e0457b; }
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; margin: 0; }
  body { font: 13px/1.4 Inter, "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; color: var(--ink); background: var(--bg); }
  button, .btn { font: inherit; border: 1px solid #c9d3d2; background: #fff; border-radius: 7px; padding: 4px 9px; cursor: pointer; color: var(--ink); display: inline-block; }
  button:hover, .btn:hover { border-color: var(--teal); } button:disabled { opacity: .45; cursor: default; }
  button.go { background: var(--teal); color: #fff; border-color: var(--teal); font-weight: 600; }
  button.sel { background: #fbecd9; border-color: var(--teal); }
  button.mini { padding: 1px 6px; font-size: 12px; }
  button.c-low { border-color: #cf3a2b; } button.c-medium { border-color: #d08a12; }
  input, select { font: inherit; padding: 4px 6px; border: 1px solid #c9d3d2; border-radius: 6px; background: #fff; color: var(--ink); min-width: 0; }
  input[type=checkbox] { flex: none; width: auto; margin: 2px 0 0; }
  a { color: var(--teal); cursor: pointer; }
  code { background: #eef2f1; padding: 0 3px; border-radius: 3px; }
  .muted { color: var(--mut); } .small { font-size: 12px; } .err { color: #b0261f; } .warn { color: #a35a00; } .nowrap { white-space: nowrap; }
  .login { max-width: 340px; margin: 12vh auto; background: #fff; padding: 22px; border-radius: 12px; border: 1px solid var(--line); display: grid; gap: 10px; }
  .login h1 { margin: 0; font-size: 20px; } .pad { padding: 20px; }
  .app { display: flex; flex-direction: column; height: 100%; }
  header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 8px 12px; background: #fff; border-bottom: 1px solid var(--line); }
  header .grp { display: flex; gap: 4px; align-items: center; }
  header input { width: 200px; }
  .bar { padding: 6px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  .bar.ok { background: #e3f6ea; } .bar.err { background: #fde6e4; } .bar.info { background: #fff6dc; }
  .bar .x { margin-left: auto; border: 0; background: transparent; font-size: 16px; }
  main { flex: 1; display: grid; grid-template-columns: 170px 1fr 380px; min-height: 0; }
  .layers { padding: 8px 10px; border-right: 1px solid var(--line); background: #fff; overflow: auto; }
  .layers label { display: block; margin: 2px 0; } .layers input[type=range] { width: 100%; }
  .layers h3, .panel h3 { font-size: 13px; margin: 12px 0 6px; } .panel h4 { font-size: 12px; margin: 12px 0 4px; }
  .leg { display: flex; align-items: center; gap: 6px; font-size: 12px; margin: 2px 0; }
  .leg i { width: 14px; height: 10px; border-radius: 2px; display: inline-block; } .leg i.dash { border: 1.5px dashed #111; }
  .mapwrap { position: relative; min-width: 0; min-height: 0; }
  svg.map { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; cursor: grab; }
  svg.map.tool-measure, svg.map.tool-addRoad { cursor: crosshair; }
  svg.map .obj, svg.map .h, svg.map .road { cursor: pointer; }
  svg.map .h { fill: #fff; stroke: #1d2a33; stroke-width: 1.4; vector-effect: non-scaling-stroke; }
  svg.map .h.on { fill: var(--sel); stroke: #fff; }
  svg.map .node.k-deadend { fill: #ffe9a8; } svg.map .node.k-portal { fill: #9fe0a9; }
  svg.map .lbl { fill: #111; paint-order: stroke; stroke: rgba(255,255,255,.85); pointer-events: none; font-weight: 600; }
  svg.map .meas { font-size: inherit; }
  .status { position: absolute; left: 8px; bottom: 6px; background: rgba(255,255,255,.85); padding: 2px 8px; border-radius: 6px; font-size: 12px; pointer-events: none; }
  .panel { display: flex; flex-direction: column; border-left: 1px solid var(--line); background: #fff; min-height: 0; }
  .panel nav { display: flex; gap: 4px; padding: 8px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .panel .body { padding: 4px 12px 16px; overflow: auto; flex: 1; }
  .f { display: grid; grid-template-columns: 140px 1fr; gap: 6px; align-items: center; margin: 5px 0; }
  .f > span:first-child { color: var(--mut); font-size: 12px; }
  .pair { display: flex; gap: 4px; } .pair input { width: 0; flex: 1; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; align-items: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
  table.kv, table.versions { width: 100%; border-collapse: collapse; margin: 6px 0; }
  table.kv td, table.versions td, table.versions th { padding: 3px 4px; border-bottom: 1px solid #eef1f0; vertical-align: top; text-align: left; }
  table.kv td:first-child { color: var(--mut); width: 45%; }
  table.versions tr.act { background: #e9f7f3; }
  ul.problems { list-style: none; padding: 0; margin: 0; } ul.problems li { padding: 4px 6px; border-bottom: 1px solid #f0f2f1; cursor: pointer; }
  ul.problems li:hover { background: #f4faf9; } ul.problems li.error { color: #b0261f; } ul.problems li.warn { color: #8a4b00; }
  .box.err { background: #fde6e4; border-radius: 8px; padding: 6px 8px; margin: 6px 0; }
  .check { display: flex; gap: 6px; align-items: flex-start; margin: 4px 0; }
  .g { color: #18a058; } .r { color: #d9423a; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; grid-template-rows: auto 60vh auto; } .layers { border-right: 0; border-bottom: 1px solid var(--line); } .panel { border-left: 0; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/web/editor.js"></script>
</body>
</html>
